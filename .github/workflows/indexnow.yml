name: IndexNow public URL changes
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy Prod]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: browseawesome-indexnow
  cancel-in-progress: false
jobs:
  notify:
    # Stable identity of LVTD-LLC/browse-awesome; renames must not disable it.
    if: >-
      github.repository_id == '1246113400' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache/restore@v4
        with:
          path: indexnow-state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-v1-
      - name: Notify IndexNow after verifying the live revision
        env:
          EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python apps/pages/indexnow.py --site-url https://browseawesome.com --state indexnow-state.json --expected-revision "$EXPECTED_REVISION"
      - uses: actions/cache/save@v4
        with:
          path: indexnow-state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
