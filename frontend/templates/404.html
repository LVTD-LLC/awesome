{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Page Not Found · Browse Awesome</title>
        <meta name="description"
              content="This page could not be found. Search GitHub repositories or browse curated awesome lists to find what you need." />
        <meta name="robots" content="noindex, follow" />
        <link rel="icon"
              type="image/svg+xml"
              href="{% static 'brand/awesome-repos-mark.svg' %}" />
        <link rel="stylesheet" href="{% static 'css/app.css' %}" />
        <script>
            try {
                var theme = localStorage.getItem("theme");
                if (theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
                    document.documentElement.classList.add("dark");
                }
            } catch (e) {}
        </script>
    </head>
    <body class="bg-white text-gray-900 dark:bg-gray-950 dark:text-gray-100">
        <main class="mx-auto max-w-3xl px-6 py-24 text-center sm:py-32">
            <p class="text-base font-semibold text-green-700 dark:text-green-400">404 · Browse Awesome</p>
            <h1 class="mt-4 text-4xl font-bold tracking-tight sm:text-5xl">This page didn’t make the awesome list.</h1>
            <p class="mt-6 text-lg text-gray-600 dark:text-gray-300">Try the catalog. It has better links.</p>
            <div class="mt-10 flex flex-wrap items-center justify-center gap-6">
                <a href="{% url 'repos:search' %}"
                   class="rounded-xl bg-green-700 px-5 py-3 font-semibold text-white hover:bg-green-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-600">Search repositories</a>
                <a href="{% url 'repos:list' %}"
                   class="font-semibold text-green-700 hover:underline dark:text-green-400">Browse awesome lists</a>
            </div>
        </main>
    </body>
</html>
