<form method="post" action="{% url 'newsletter' %}" class="mt-6">
    {% csrf_token %}
    {{ form.company }}
    <label for="{{ form.email.id_for_label }}"
           class="block text-sm font-semibold text-gray-900 dark:text-white">Email address</label>
    <div class="mt-2 flex flex-col gap-3 sm:flex-row">
        {{ form.email }}
        <button type="submit" class="app-button-primary shrink-0">Get the weekly email</button>
    </div>
    <div class="mt-2 text-sm text-red-700 dark:text-red-300" role="alert">{{ form.email.errors }}</div>
    <p class="mt-3 text-sm text-gray-600 dark:text-gray-400">
        Confirm by email to subscribe. Unsubscribe anytime. <a href="{% url 'privacy_policy' %}" class="underline">Privacy policy</a>.
    </p>
</form>
